<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Cirqle</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-bg-circle auth-bg-circle-1"></div>
      <div class="auth-bg-circle auth-bg-circle-2"></div>

      <section class="auth-card">
        <div class="auth-brand">
          <div class="logo-icon small-logo">
            <span></span>
          </div>
          <h1 class="brand-title">Cirqle</h1>
        </div>

        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">
          Join Cirqle and start building your community.
        </p>

        <form id="registerForm">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            placeholder="Enter your username"
            required
          />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            minlength="6"
          />

          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            required
            minlength="6"
          />

          <p id="registerMessage" class="message"></p>

          <button type="submit" class="auth-btn">Create Account</button>
        </form>

        <p class="switch-page">
          Already have an account? <a href="login.html">Login</a>
        </p>
      </section>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
