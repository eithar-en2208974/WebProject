<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Cirqle</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-bg-circle auth-bg-circle-1"></div>
      <div class="auth-bg-circle auth-bg-circle-2"></div>

      <section class="auth-card">
        <div class="auth-brand">
          <div class="logo-icon small-logo">
            <span></span>
          </div>
          <h1 class="brand-title">CIRQLE</h1>
        </div>

        <h2 class="auth-title">Welcome Back</h2>
        <p class="auth-subtitle">Sign in to continue sharing and connecting.</p>

        <form id="loginForm">
          <label for="loginEmail">Email</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
            required
          />

          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
            required
            minlength="6"
          />

          <p id="loginMessage" class="message"></p>

          <button type="submit" class="auth-btn">Login</button>
        </form>

        <p class="switch-page">
          Don’t have an account? <a href="register.html">Create one</a>
        </p>
      </section>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
